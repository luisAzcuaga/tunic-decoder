<!DOCTYPE html>

<style>
  #vowels-container,
  #consonants-container {
    display: flex;
    flex-wrap: wrap;
    margin: 20px auto;
    justify-content: space-around;
    max-width: 800px;
  }

  .rune {
    display: flex;
    flex-direction: column;
    width: 50px;
    height: 100px;
    color: white;
    margin: 35px;
    border: 0.1px dotted #333;
    position: relative;
  }

  .rune:hover::after {
    opacity: 1;
  }

  .rune::after {
    opacity: 0;
    content: '...';
    color: black;
    background-color: white;
    justify-self: center;
    position: absolute;
    top: 50%;
    left: 50%;
    translate: -50% -50%;
    font-size: 30px;
    /* border-radius: 10px; */
    font-family: Helvetica, sans-serif;
    transition: 0.3s all;
  }

  .rune-chunk-container {
    height: 33.3px;
  }

  .rune-middle-chunk-container {
    display: flex;
    justify-content: space-between;
    height: 33.3px
  }

  .rune-segment {
    /* border-radius: 10px; */
    box-shadow: 0 0 5px 2px white;
    background-color: white;
    display: block;

  }

  article#vowels-container .rune .rune-segment.upper-left {
    height: 1px;
    width: 41.6px;
    rotate: -53.17deg;
    transform: translate(-18px, 3.3px);
  }

  article#vowels-container .rune .rune-segment.upper-right {
    height: 1px;
    width: 41.6px;
    rotate: 53.17deg;
    transform: translate(22px, -4px);
  }

  article#vowels-container .rune .rune-segment.middle-left {
    height: 33.3px;
    width: 1px;
  }

  article#vowels-container .rune .rune-segment.middle-right {
    height: 33.3px;
    width: 1px;
  }



  article#vowels-container .rune .rune-segment.lower-left {
    height: 1px;
    width: 41.6px;
    rotate: 53.17deg;
    transform: translate(8px, 16px);
  }

  article#vowels-container .rune .rune-segment.lower-right {
    height: 1px;
    width: 41.6px;
    rotate: -53.17deg;
    transform: translate(-2px, 22px);
  }

  article #outer-1 {

    .middle-right,
    .lower-left,

    }
  }

  #outer-2.rune::after {
    content: 'o';
